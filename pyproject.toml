[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproseed"
version = "0.1.0"
description = "Small deterministic execution contexts for Python tests and experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["testing", "determinism", "reproducibility", "fixtures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/faizanali2k05/reproseed"
Repository = "https://github.com/faizanali2k05/reproseed"
Issues = "https://github.com/faizanali2k05/reproseed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/reproseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
